<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for mobile & desktop bookmarks -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Glowing Cadence Shield Icon -->
  <g filter="url(#shieldShadow)">
    <!-- Main Shield Body -->
    <path d="M 256,88 
             C 344,88 388,114 388,114 
             C 388,272 334,364 256,424 
             C 178,364 124,272 124,114 
             C 124,114 168,88 256,88 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#glowGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Accent Line -->
    <path d="M 256,124 
             C 320,124 354,144 354,144 
             C 354,264 312,336 256,386 
             C 200,336 158,264 158,144 
             C 158,144 192,124 256,124 Z" 
          fill="none 
          stroke="#c7d2fe" 
          stroke-width="5" 
          stroke-opacity="0.35" 
          stroke-linejoin="round"/>

    <!-- Sharp Center Checkmark / Incident Verification Emblem -->
    <path d="M 204,248 L 242,286 L 314,204" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
