services:
  cadence:
    build: .
    image: cadence:latest
    container_name: cadence
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - NODE_ENV=production
      # Optional: AES-256-GCM encryption at rest on the Unraid server array
      # - ENCRYPTION_PASSPHRASE=your-strong-passphrase-here
    volumes:
      # Map host appdata directory to /app/data for permanent storage across container updates and resets
      # (Note: Container also dual-syncs to /data for compatibility with alternate volume setups)
      - /mnt/user/appdata/cadence:/app/data
